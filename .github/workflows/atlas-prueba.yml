name: Probar el Atlas en móvil
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/atlas-prueba.yml"
      - ".github/scripts/atlas-prueba.cjs"
      - "piloto/qr-nepal.png"
      - "piloto/qr-malta.png"
permissions:
  contents: read

jobs:
  movil:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Preparar los navegadores
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-prueba" --no-save --no-package-lock playwright@1.62.1 jsqr@1.4.0 pngjs@7.0.0
          "$RUNNER_TEMP/atlas-prueba/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Escanear los QR y comprobar ambas fichas
        run: NODE_PATH="$RUNNER_TEMP/atlas-prueba/node_modules" node .github/scripts/atlas-prueba.cjs
