name: Verificar las imágenes de 5 rublos bielorrusos
on:
  push:
    branches: [atlas-revision-imagenes]
permissions:
  contents: read
jobs:
  muestra:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extraer las dos caras de la lámina del Banco Nacional de Polonia
        run: |
          python3 -m pip install --quiet Pillow pymupdf
          python3 - <<'PY'
          import base64, hashlib, json, urllib.request
          from io import BytesIO
          import fitz
          from PIL import Image

          def emit(key,pix):
              im=Image.open(BytesIO(pix.tobytes('png'))).convert("RGB")
              output=BytesIO()
              im.save(output,'JPEG',quality=88,optimize=True)
              raw=output.getvalue()
              print("BIL055_FILE",json.dumps({"key":key,"width":im.width,"height":im.height,"sha256":hashlib.sha256(raw).hexdigest()}))
              value=base64.b64encode(raw).decode("ascii")
              for at in range(0,len(value),5200):
                  print("BIL055_EXPORT",key,value[at:at+5200])

          for name in ('bialorus-druk.pdf','bialorus-www.pdf'):
              try:
                  url='https://static.nbp.pl/publikacje/album-walut/'+name
                  with urllib.request.urlopen(url, timeout=24) as fetched:
                      raw=fetched.read()
                  document=fitz.open(stream=raw,filetype="pdf")
                  page=document[5]
                  raster=page.get_pixmap(matrix=fitz.Matrix(1.3,1.3),alpha=False)
                  print('BIL055_PAGE', name, page.number+1, page.rect, repr(page.get_text()[:300]))
                  emit(name+'-page',raster)
                  found=[]
                  for info in page.get_image_info(xrefs=True):
                      box=fitz.Rect(info["bbox"])
                      print("BIL055_BOX",name, list(box),info["width"],info["height"])
                      if box.get_area()>3500 and 1.65 < box.width/box.height < 2.15:
                          if not any(box.intersect(prior).get_area()>box.get_area()*.7 for prior in found):
                              found.append(box)
                  found=sorted(sorted(found,key=lambda x:x.get_area(),reverse=True)[:2],key=lambda x:x.y0)
                  if len(found)==2:
                      for side,box in zip(('front','back'),found):
                          factor=1100/box.width
                          emit(name+'-'+side,page.get_pixmap(matrix=fitz.Matrix(factor,factor),clip=box,alpha=False))
              except Exception as error:
                  print('BIL055_ERROR',name,error)
          PY
