name: Verificar las fotografías licenciadas del Caribe Oriental
on:
  push:
    branches: [atlas-revision-imagenes]
permissions:
  contents: read
jobs:
  muestras:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verificar frente y reverso publicados por su fotógrafo
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import base64, hashlib, json, urllib.request
          from io import BytesIO
          from PIL import Image
          sources = {
              "front":"https://en.numista.com/catalogue/photos/oeco/660bb7a46367d1.31662060-original.jpg",
              "back":"https://en.numista.com/catalogue/photos/oeco/660bb7a7238d00.45183771-original.jpg",
          }
          for side,url in sources.items():
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'image/jpeg,image/*;q=0.8'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  raw=response.read()
              with Image.open(BytesIO(raw)) as photo:
                  assert photo.format == 'JPEG'
                  width,height=photo.size
                  photo.verify()
              print('APPROVED_FILE',json.dumps({'side':side,'width':width,'height':height,'sha256':hashlib.sha256(raw).hexdigest()}))
              encoded=base64.b64encode(raw).decode('ascii')
              for offset in range(0,len(encoded),5200):
                  print('ATLAS_EXPORT','licensed-'+side,encoded[offset:offset+5200])
          PY
