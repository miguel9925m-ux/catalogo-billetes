name: Preparar la referencia ilustrada del billete mexicano
on:
  push:
    branches: [atlas-revision-imagenes]
permissions:
  contents: read
jobs:
  muestras:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Preparar ambas caras a partir de la lámina oficial
        run: |
          python3 -m pip install --quiet Pillow pymupdf
          python3 - <<'PY'
          import base64, fitz, hashlib, io, json, urllib.request
          from PIL import Image
          
          def emit(key, image):
              output = io.BytesIO()
              image.convert("RGB").save(output, "JPEG", quality=87, optimize=True)
              raw = output.getvalue()
              print("MX_IMAGE",json.dumps({"name":key,"width":image.width,"height":image.height,"sha256":hashlib.sha256(raw).hexdigest()}))
              value = base64.b64encode(raw).decode("ascii")
              for start in range(0, len(value), 5000):
                  print("MX_BYTES", key, value[start:start+5000])
          
          with urllib.request.urlopen("https://www.banxico.org.mx/billetes-y-monedas/d/%7BAC94B18D-4090-5D45-37E4-FF7AF63AFAEF%7D.pdf", timeout=25) as response:
              document = fitz.open(stream=response.read(), filetype="pdf")
          page = document[0]
          boxes = {
              "front": (36, 243, 315, 394),
              "back": (373, 235, 513, 490),
          }
          for side, edges in boxes.items():
              box = fitz.Rect(*(edge / 0.9 for edge in edges))
              scale = 1300 / max(box.width, box.height)
              crop = page.get_pixmap(matrix=fitz.Matrix(scale,scale), clip=box, alpha=False)
              emit(side, Image.open(io.BytesIO(crop.tobytes("png"))))
          
          with urllib.request.urlopen("https://museobancodemexico.mx/documentos/cedulario-esp_fam_billetes.pdf", timeout=18) as response:
              museum = fitz.open(stream=response.read(), filetype="pdf")
          for p in museum:
              excerpt = " ".join(p.get_text().split()).lower()
              if ("cocodrilo" in excerpt and ("trigarante" in excerpt or "garza" in excerpt)) or "reverso del billete de 20" in excerpt:
                  print("MX_MUSEO", p.number+1, excerpt[:160])
                  if len(p.get_image_info()) < 12:
                      pix = p.get_pixmap(matrix=fitz.Matrix(0.65,0.65), alpha=False)
                      emit("museo" + str(p.number+1), Image.open(io.BytesIO(pix.tobytes("png"))))
          PY
