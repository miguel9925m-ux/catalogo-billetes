name: Confirmar las imágenes publicadas del Atlas
on:
  push:
    branches: [atlas-revision-imagenes]
permissions:
  contents: read
jobs:
  imagenes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cotejar las imágenes publicadas con los archivos revisados
        run: |
          python3 - <<'PY'
          import hashlib, re, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from time import sleep
          
          base = "https://miguel9925m-ux.github.io/catalogo-billetes/piloto/"
          expected = {
              "bil-053-anverso.jpg": "bb4bc1ae2344bf89aba9f9d370977de85419bf1b",
              "bil-053-reverso.jpg": "c14a2c14970ff6c20edb8fadb5e5aea28689c3bf",
              "bil-001-guia-banxico-anverso.jpg": "640ad24a385574979826b42051536ab2ce2cab0f",
              "bil-001-guia-banxico-reverso.jpg": "b83d19956dbbdd8c2286f8c75e9753e3366fdf2d",
          }
          
          def read(path):
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(base + path, headers={"Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req, timeout=8) as response:
                          return response.read()
                  except OSError:
                      if attempt == 2:
                          raise
                      sleep(2)
          
          def compare(filename):
              raw = read("assets/" + filename)
              assert raw.startswith(bytes.fromhex("ffd8")) and raw.endswith(bytes.fromhex("ffd9")), filename
              recorded = hashlib.sha1(f"blob {len(raw)}".encode()+bytes(1)+raw).hexdigest()
              assert recorded == expected[filename], (filename, recorded)
              print("MX_JPEG_LIVE",filename,"ok",len(raw))
          
          with ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(compare, expected))
          page = read("billetes/bil-001/index.html?lang=es").decode()
          assert "Guía ilustrada del Banco de México" in page
          assert "garza chocolatera" in page
          for name in expected:
              if name.startswith("bil-001"):
                  assert re.search(r'data-reference="[^"]*'+re.escape(name)+r'"', page), name
          print("MX_PUBLISHED_MATCH BIL-001 and the four image bytes")
          PY
