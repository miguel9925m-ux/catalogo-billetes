<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#15372e">
  <meta name="description" content="Atlas de Billetes. Fichas piloto de Nepal y Malta.">
  <title>Atlas de Billetes</title>
  <link rel="stylesheet" href="assets/atlas.css">
</head>
<body data-page="catalogue">
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="index.html" data-language-link>
        <span class="brand-note" aria-hidden="true"></span>
        <span>Atlas de Billetes</span>
      </a>
      <div class="languages" role="group" aria-label="Idioma" data-label="language">
        <button type="button" data-language="es" aria-pressed="true" aria-label="Español" lang="es">ES</button>
        <button type="button" data-language="en" aria-pressed="false" aria-label="English" lang="en">EN</button>
      </div>
    </div>
  </header>
  <main class="shell home" id="catalogo">
    <h1 data-copy="homeTitle">Catálogo piloto</h1>
    <div class="pilot-entries">
      <a class="preview-entry" href="billetes/bil-049/index.html" data-language-link>
        <span class="photo-window preview-image" data-home-photo="BIL-049">
          <img src="assets/nepal-anverso.jpg" width="1050" height="788" alt="">
        </span>
        <span class="preview-entry-text">
          <span class="note-id">BIL-049 · Nepal</span>
          <span class="preview-title" data-title-note="BIL-049">100 rupias nepalíes</span>
          <span class="entry-action" data-copy="openNote">Abrir ficha</span>
        </span>
      </a><a class="preview-entry" href="billetes/bil-073/index.html" data-language-link>
        <span class="photo-window preview-image" data-home-photo="BIL-073">
          <img src="assets/malta-anverso.jpg" width="1050" height="506" alt="">
        </span>
        <span class="preview-entry-text">
          <span class="note-id">BIL-073 · Malta</span>
          <span class="preview-title" data-title-note="BIL-073">2 liras maltesas</span>
          <span class="entry-action" data-copy="openNote">Abrir ficha</span>
        </span>
      </a>
    </div>
  </main>
  <script defer src="assets/pilot-data.js"></script>
  <script defer src="assets/atlas.js"></script>
</body>
</html>
